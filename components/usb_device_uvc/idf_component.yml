dependencies:
  cmake_utilities:
    version: "*"
  espressif/tinyusb:
    version: "=0.15.0~10"
    # don't try to resolve tinyusb for targets without USB device support, see CMakeLists.txt
    rules:
      - if: "target in [esp32s2, esp32s3, esp32p4]"
  idf:
    version: ">=5.0"
description: USB Device UVC, Streaming Video to Host
documentation: https://docs.espressif.com/projects/esp-iot-solution/en/latest/usb/usb_device/usb_device_uvc.html
issues: https://github.com/espressif/esp-iot-solution/issues
repository: git://github.com/espressif/esp-iot-solution.git
repository_info:
  commit_sha: e2529ce3b0aa6362663b4c53d7e9ba21ff307f49
  path: components/usb/usb_device_uvc
# no "targets:" list here: it makes the component manager reject the whole project on other targets.
# CMakeLists.txt registers an empty component on targets without USB device support instead
url: https://github.com/espressif/esp-iot-solution/tree/master/components/usb/usb_device_uvc
version: 1.1.0
